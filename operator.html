<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="operator.css">
    <title>Halaman Operator</title>
    <script type="module" src="dist/operator.js"></script>
</head>
<body>
    <header class="operator-header">
        <h1>Sistem Antrean - Operator</h1>
        <button id="operator-logout" type="button">Logout</button>
    </header>

    <main class="operator-main">
        <section class="operator-section">
            <h2>Antrean yang Sedang Dipanggil</h2>
            <h3 id="current-number">—</h3>
            <p id="current-service">Belum ada antrean yang dipanggil.</p>
            <p id="current-priority">Tidak ada tiket aktif.</p>

            <div class="operator-actions">
                <button id="call-next" type="button">Panggil Berikutnya</button>
                <button id="skip-current" type="button">Lewati</button>
                <button id="finish-current" type="button">Selesai</button>
            </div>

            <p id="operator-message" role="status" aria-live="polite"></p>
        </section>

        <section class="operator-section">
            <h2>Daftar Antrean Menunggu</h2>
            <div id="next-list"></div>
        </section>
    </main>
</body>
</html>
